[project]
name = "stonepedia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Heejoon Lee", email = "heejoon1130@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.156.0",
    "httpx>=0.28.1",
    "markdownify>=1.2.3",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.1",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "temporalio>=1.34.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["tests"]
